<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
   <meta charset='UTF-8'>
    <title>Flight Time Limitations</title>
    <meta name="viewport"
          content="width=device-width, minimum-scale=1.0, shrink-to-fit=no">
    <style>
     :root {
         --thin-border: 0.0625rem solid black;
         --thick-border: 0.125rem solid black;
         --stripe: #E0FFE0;
         background-color: white;
         color: black;
         font-family: arial, sans-serif;
     }

     body {
         width:102rem;
         padding-bottom: 2rem;
     }

     table {
         margin: auto;
         text-align: center;
         table-layout: fixed;
         width: 100rem;
         border-collapse: separate;
         border-spacing: 0;
     }

     thead {
         background-color: white;
         font-weight: bold;
         position: sticky;
         top: 0;
         z-index: 2;
     }

     td:first-child, thead tr:first-child th:first-child {
         position: sticky;
         left: 0;
         z-index: 1;
         background-color: white;
     }


     tbody tr:nth-child(even) td {
         background-color: var(--stripe);
     }

     tbody tr.highlight td {
         background-color: yellow;
     }

     tbody {
         cursor: pointer;
     }

     .j-col-date {
         width: 8rem;
     }

     .j-col-duration {
         width: 7rem;
     }

     thead tr, tbody tr {
         height: 2rem;
     }

     tfoot tr {
         height:0;
     }

     tbody td, thead th {
         border-bottom: var(--thin-border);
         border-right: var(--thin-border);
     }

     thead th:last-child,
     thead tr:first-child th,
     thead tr:nth-child(2) th:nth-child(6),
     tbody td:nth-child(1),
     tbody td:nth-child(7),
     tbody td:last-child {
         border-right: var(--thick-border);
     }

     thead tr:first-child th:first-child,
     thead tr:nth-child(2) th {
         border-bottom: var(--thick-border);
     }

     tbody tr:last-child td {
         border-bottom: unset;
     }

     thead tr:first-child th:first-child,
     tbody td:first-child {
         border-left: var(--thick-border);
     }

     thead tr:first-child th,
     tfoot td {
         border-top: var(--thick-border);
     }

     @media print {
         @page {
             size: A4 landscape;
             margin: 1cm;
         }
         :root {
             font-size: 2.763mm;
             --thick-border: 0.15rem solid black;
         }
         body {
             margin: 0;
             padding: 0;
         }
         thead,
         td:first-child, thead tr:first-child th:first-child {
             position: relative;
         }
     }

    </style>
    <script>
     document.addEventListener("DOMContentLoaded", () => {
         for(let row of document.getElementsByTagName("tr")) {
             row.addEventListener("click", function () {
                 this.classList.toggle("highlight");
             });
         }
     });
    </script>

  </head>
  <body>
    <table class='j-ftl-table'>
      <colgroup>
        <col class="j-col-date">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
      </colgroup>
      <thead>
        <tr><th rowspan="2">Date</th><th colspan="6">Duty</th><th colspan="7">Block</th></tr>
        <tr><th>7 Days</th><th>14 Days</th><th>28 Days</th><th>12 Weeks</th><th>365 days</th><th>12 Calendar Months</th>
          <th>28 Days</th><th>12 Weeks</th><th>365 Days</th><th>6 Calendar Months</th><th>9 Calendar Months</th><th>12 Calendar Months</th><th>1 Calendar Year</th></tr>
      </thead>
      <tbody>
<!--{rows}-->
      </tbody>
      <tfoot><tr><td colspan="14"></td></tr></tfoot>
    </table>
  </body>
</html>
