<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
   <meta charset='UTF-8'>
   <title>Crew</title>
   <meta name="viewport"
         content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
   <style>
    :root {
        --thin-border: 0.0625rem solid black;
        --thick-border: 0.125rem solid black;
        --stripe: #E0FFE0;
    }

    body {
        background-color: white;
        color: black;
        font-family: helvetica, arial, sans-serif;
        position: relative;
        margin: 0;
        padding: 0 0 2rem;
    }

    input {
        padding: 0.25rem 0.5rem;
        font-size: 1rem;
        border: var(--thin-border);
    }

    button {
        background-color: white;
        color: black;
        font-size: 1rem;
        border: var(--thin-border);
        padding: 0.25rem 0.5rem;
        width: 5rem;
    }

    @media (hover: hover) and (pointer: fine) {
        button:hover {
            background-color: var(--stripe);
        }
    }

    table {
        margin: auto;
        border-collapse: collapse;
        text-align: center;
        table-layout: fixed;
        border: var(--thick-border);
        width: 45rem;
    }

    td {
        border-left:var(--thin-border);
        border-right:var(--thin-border);
        padding: 0.5rem;
    }

    td:first-child {
        text-align: left;
        opacity: 0;
    }

    td:last-child {
        text-align: left;
    }

    tr.first td:first-child {
        opacity: 1;
    }

    tr.first {
        border-top: var(--thin-border);
    }

    .hidden {
        display: none;
    }

    .stripe {
        background-color: var(--stripe);
    }

    .filter {
        padding: 1rem;
        position: sticky;
        top: 0;
        background-color: white;
        margin-bottom: 1rem;
        border-bottom: var(--thin-border);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
    }

    .j-col-name {
        width: 15rem;
    }
    .j-col-date {
        width: 7rem;
    }
    .j-col-role {
        width: 3rem;
    }

    @media print {
        @page {
            size: A4;
            margin: 1cm;
        }
        :root {
            font-size: 2.763mm;
            --thick-border: 0.15rem solid black;
        }
        .filter {
            display: none;
        }
    }

   </style>
<script>
 let WORD_CACHE;

 document.addEventListener("DOMContentLoaded", () => {
     document.getElementById("do_filter").addEventListener("click", filter);
     document.getElementById("filter_box").addEventListener("keyup", e => {
         if(e.key == "Enter") filter();});
     let rows = document.getElementsByTagName("tr");
     WORD_CACHE = new Array(rows.length)
     for(let c = 0; c < rows.length; c++) {
         WORD_CACHE[c] = rows[c].getElementsByTagName("td")[0].innerText
                                .toLowerCase().split(" ");
     }
     filter();
 });

 function filter() {
     let text = document.getElementById("filter_box").value.toLowerCase();
     let rows = document.getElementsByTagName("tr");
     let hidden = new Array(rows.length);
     if(!text) {
         hidden.fill(false);
     } else {
         hidden.fill(true);
         for(let c = 0; c < rows.length; c++) {
             for(let word of WORD_CACHE[c]) {
                 if(word.startsWith(text)) {
                     hidden[c] = false;
                     break;
                 }
             }
         }
     }
     let stripe = false
     for(let c = 0; c < rows.length; c++) {
         if(hidden[c]) {
             rows[c].classList.add("hidden");
         } else {
             rows[c].classList.remove("hidden");
             if(rows[c].classList.contains("first")){
                 stripe = stripe ? false : true;
             }
             if(stripe) {
                 rows[c].classList.add("stripe");
             } else {
                 rows[c].classList.remove("stripe");
             }
         }
     }
 }
</script>
  </head>
  <body>
    <div class="filter">
      <input id="filter_box" type="text">
      <button id="do_filter">Filter</button>
    </div>
    <table class='j-table'>
      <colgroup>
        <col class="j-col-name">
        <col class="j-col-role">
        <col class="j-col-date">
        <col class="j-col-route">
      </colgroup>
      <tbody>
<!--{rows}-->
      </tbody>
    </table>
  </body>
</html>
