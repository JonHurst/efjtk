<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
   <meta charset='UTF-8'>
   <title>FCL.050 Logbook</title>
   <meta name="viewport"
         content="width=device-width, minimum-scale=1.0, shrink-to-fit=no">
<style>
  :root {
      --thin-border: 1px solid black;
      --thick-border: 2px solid black;
      --stripe: #E0FFE0;
      background-color: white;
      color: black;
      font-family: "Helvetica", "Arial", sans-serif;
  }

  body {
      width: min-content;
      margin: 0 auto;
      padding: 1rem;
  }

  table {
      border-collapse: separate;
      border-spacing: 0;
      text-align: center;
      table-layout: fixed;
      width: 100rem;
  }

  thead {
      background-color: white;
      font-weight: bold;
  }

  @media screen {
      thead {
          position: sticky;
          top: 0;
          z-index: 2;
      }
      tbody td:first-child,
      thead tr:first-child th:first-child {
          position: sticky;
          left: 0;
          z-index: 1;
      }
  }

  tbody tr:nth-child(even) td {
      background-color: var(--stripe);
  }

  tbody tr.highlight td {
      background-color: yellow;
  }

  tbody {
      cursor: pointer;
  }

  td, th {
      overflow: hidden;
      text-overflow: ellipsis;
  }

  td:last-child,
  td:nth-child(12) {
      text-align: left;
  }

  .j-col-date {
      width: 7rem;
  }
  .j-col-place {
      width: 5rem;
  }
  .j-col-time {
      width: 3.75rem;
  }
  .j-col-duration {
      width: 3.5rem;
  }
  .j-col-type {
      width: 6rem;
  }
  .j-col-reg {
      width: 6rem;
  }
  .j-col-narrow {
      width: 2.25rem;
  }
  .j-col-pic {
      width: 9rem;
  }

  thead th,
  tbody td {
      background-color: white;
      padding: 0.5rem 0.25rem;
      font-size: 1rem;
      border-right: var(--thin-border);
      border-bottom: var(--thin-border);
  }

  tbody td:nth-child(1),
  tbody td:nth-child(3),
  tbody td:nth-child(5),
  tbody td:nth-child(7),
  tbody td:nth-child(9),
  tbody td:nth-child(10),
  tbody td:nth-child(11),
  tbody td:nth-child(12),
  tbody td:nth-child(14),
  tbody td:nth-child(16),
  tbody td:nth-child(20),
  tbody td:nth-child(21),
  thead tr:first-child th,
  thead tr:nth-child(2) th:nth-child(2),
  thead tr:nth-child(2) th:nth-child(4),
  thead tr:nth-child(2) th:nth-child(6),
  thead tr:nth-child(2) th:nth-child(8),
  thead tr:nth-child(2) th:nth-child(10),
  thead tr:nth-child(2) th:nth-child(12),
  thead tr:nth-child(2) th:nth-child(16)  {
      border-right: var(--thick-border);
  }

  thead tr:nth-child(2) th,
  thead tr:first-child th:nth-child(1),
  thead tr:first-child th:nth-child(6),
  thead tr:first-child th:nth-child(7),
  thead tr:first-child th:nth-child(8),
  thead tr:first-child th:nth-child(12) {
      border-bottom: var(--thick-border);
  }

  tbody td:first-child,
  thead tr:first-child th:first-child {
      border-left: var(--thick-border);
  }

  thead tr:first-child th {
      border-top: var(--thick-border);
  }
  tfoot td {
      border-top: var(--thin-border);
      height: 0;
      padding: 0;
  }

  @media print {
     @page {
         size: A4 landscape;
         margin: 10mm 10mm 7.23mm 10mm;
     }
      :root {
          font-size: 2.77mm;
      }
      body {
          padding: 0;
      }
  }

</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
      for(let row of document.getElementsByTagName("tr")) {
          row.addEventListener("click", function () {
              this.classList.toggle("highlight");
          });
      }
  });
</script>
  </head>
  <body>
    <table>
<colgroup>
<col class="j-col-date">
<col class="j-col-place">
<col class="j-col-time">
<col class="j-col-place">
<col class="j-col-time">
<col class="j-col-type">
<col class="j-col-reg">
<col class="j-col-narrow">
<col class="j-col-narrow">
<col class="j-col-duration">
<col class="j-col-duration">
<col class="j-col-pic">
<col class="j-col-narrow">
<col class="j-col-narrow">
<col class="j-col-duration">
<col class="j-col-duration">
<col class="j-col-duration">
<col class="j-col-duration">
<col class="j-col-duration">
<col class="j-col-duration">
<col class="j-col-remark">
</colgroup>
      <thead>
        <tr><th rowspan="2">Date</th>
            <th colspan="2">Departure</th><th colspan="2">Arrival</th>
            <th colspan="2">Aircraft</th>
            <th colspan="2">Single Pilot</th><th rowspan="2">Multi Pilot</th>
            <th rowspan="2">Total</th>
            <th rowspan="2">PIC</th>
            <th colspan="2">Ldgs</th>
            <th colspan="2">Conditions</th>
            <th colspan="4">Pilot Function</th>
            <th rowspan="2">Remarks and Endorsements</th></tr>
        <tr><th>Place</th><th>Time</th><th>Place</th><th>Time</th>
            <th>Type</th><th>Reg</th>
            <th>SE</th><th>ME</th>
            <th>D</th><th>N</th>
            <th>Night</th><th>IFR</th>
            <th>PIC</th><th>Co-Pilot</th><th>Dual</th><th>Inst</th></tr>
      </thead>
      <tbody>
<!--{rows}-->
      </tbody>
      <tfoot>
        <tr><td colspan="21"></td></tr>
      </tfoot>
    </table>
  </body>
</html>
