<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
   <meta charset='UTF-8'/>
    <title>eFJ Tool</title>
    <link rel="stylesheet" type="text/css" href="styles.2.css"/>
    <script src="script.6.js" type="text/javascript"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  </head>
  <body>
    <div id="working" class="working hidden">Working…</div>
    <div class="grid">
      <div class="sidebar">
        <button id="help">Help</button>
        <fieldset>
          <legend>Actions</legend>
          <button id="load_efj">Load</button>
          <input class="file" id="input" type="file" />
          <button id="clear">Clear</button>
          <button id="save">Save</button>
          <button id="copy">Copy</button>
        </fieldset>
        <fieldset>
          <legend>Download</legend>
          <button id="logbook"><span class="hide-narrow">FCL.050 </span>Logbook</button>
          <button id="cumulative">Cumulative</button>
          <button id="summary">Summary</button>
        </fieldset>
        <fieldset>
          <legend>Modify</legend>
          <button id="expand">Expand</button>
          <button id="night">Night</button>
          <button id="vfr">VFR</button>
          <button id="fo">FO</button>
          <button id="ins">Instructor</button>
          <button id="back">Undo</button>
        </fieldset>
      </div>
      <textarea id="output" class="editor" contenteditable="true"
                spellcheck="false" wrap="off"
                ></textarea>
    </div>
    <dialog id="error_dialog">
      <h2>Error</h2>
      <div id="error_message"> </div>
      <div class="dialog-buttons">
        <button id="error_ok">OK</button>
      </div>
    </dialog>
    <dialog id="date_range_dialog">
      <h2>Date Range</h2>
      <div class="date-entry">
        <label for="dr_from">From (inclusive): </label>
        <input id="dr_from" type="date">
      </div>
      <div class="date-entry">
        <label for="dr_to">To (exclusive): </label>
        <input id="dr_to" type="date">
      </div>
      <div class="dialog-buttons">
        <button id="dr_ok">OK</button>
      </div>
      </div>
    </dialog>
  </body>
</html>
