<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
   <meta charset='UTF-8'>
    <title>Summary</title>
    <style>
     :root {
         --thin-border: 0.0625rem solid black;
         --thick-border: 0.125rem solid black;
         --stripe: #E0FFE0;
         color: black;
         font-family: arial, sans-serif;
     }
     body {
         background-color: white;
     }

     table {
         border: var(--thick-border);
         border-collapse: collapse;
         table-layout: fixed;
         width: 80rem;
         break-inside: avoid;
         margin: 0 auto 2rem;
     }

     tr {
         height: 2rem;
     }

     thead {
         border: var(--thick-border);
     }

     thead tr:first-child th:first-child {
         width: 9rem;
     }

     td, th {
         text-align: center;
         border: var(--thin-border);
     }

     tbody th,
     thead tr:first-child th,
     .table-1 tbody td:nth-child(2),
     .table-2 thead tr:nth-child(2) th:nth-child(3),
     .table-2 thead tr:nth-child(2) th:nth-child(7),
     .table-2 tbody td:nth-child(4),
     .table-2 tbody td:nth-child(8) {
         border-right: var(--thick-border);
     }

     tbody tr:nth-child(even) {
         background-color: var(--stripe);
     }

     tbody tr:last-child {
         border-top: var(--thick-border);
         font-weight: bold;
         background-color: white;
     }


     @media print {
         @page {
             size: A4 landscape;
             margin: 1cm;
         }
         :root {
             font-size: 2.763mm;
             --thick-border: 0.15rem solid black;
         }
     }
    </style>
  </head>
  <body>
    <table class="table-1">
      <thead>
        <tr><th rowspan="2">Type</th><th rowspan="2">Total</th>
          <th colspan="7">Roles</th></tr>
        <tr><th>pic</th><th>p1</th><th>p1s</th><th>p2</th><th>put</th>
          <th>other</th><th>ins</th></tr>
      </thead>
      <tbody>
        <tr><th>A320</th><td>2:00</td><td>2:00</td><td>2:00</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr><th>A321</th><td>3:00</td><td>3:00</td><td>3:00</td><td></td><td></td><td></td><td></td><td></td></tr>
<tr class='col_total'><th>Total</th><td class='total'>5:00</td><td class="total">5:00</td><td class="total">5:00</td><td class="total"></td><td class="total"></td><td class="total"></td><td class="total"></td><td class="total"></td></tr>
      </tbody>
    </table>
    <table class="table-2">
      <thead>
        <tr><th rowspan="2">Type</th><th colspan="3">Classes</th>
          <th colspan="4">Conditions</th><th colspan="2">Landings</th></tr>
        <tr><th>SPSE</th><th>SPME</th><th>MC</th><th>VFR</th><th>IFR</th>
          <th>Day</th><th>Night</th><th>Day</th><td>Night</td></tr>
      </thead>
      <tbody>
        <tr><th>A320</th><td></td><td></td><td>2:00</td><td></td><td>2:00</td><td>2:00</td><td></td><td>1</td><td>0</td></tr>
<tr><th>A321</th><td></td><td></td><td>3:00</td><td></td><td>3:00</td><td>3:00</td><td></td><td>1</td><td>0</td></tr>
<tr class='col_total'><th>Total</th><td class='total'></td><td class="total"></td><td class="total">5:00</td><td class="total"></td><td class="total">5:00</td><td class="total">5:00</td><td class="total"></td><td>2</td><td class="total">0</td></tr>
      </tbody>
    </table>
  </body>
</html>
