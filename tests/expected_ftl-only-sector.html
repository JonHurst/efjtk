<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
   <meta charset='UTF-8'>
    <title>Flight Time Limitations</title>
    <meta name="viewport"
          content="width=device-width, minimum-scale=1.0, shrink-to-fit=no">
    <style>
     :root {
         --thin-border: 1px solid black;
         --thick-border: 2px solid black;
         --stripe: #E0FFE0;
         background-color: white;
         color: black;
         font-family: "Helvetica", "Arial", sans-serif;
     }

     body {
         width: min-content;
         padding: 1rem;
         margin: 0 auto;
     }

     table {
         text-align: center;
         table-layout: fixed;
         width: 100rem;
         border-collapse: separate;
         border-spacing: 0;
     }

     thead {
         background-color: white;
         font-weight: bold;
     }

     @media screen {
         thead {
             position: sticky;
             top: 0;
             z-index: 2;
         }
         tbody td:first-child,
         thead tr:first-child th:first-child {
             position: sticky;
             left: 0;
             z-index: 1;
         }
     }

     tbody tr:nth-child(even) td {
         background-color: var(--stripe);
     }

     tbody tr.highlight td {
         background-color: yellow;
     }

     tbody {
         cursor: pointer;
     }

     .j-col-date {
         width: 8rem;
     }

     .j-col-duration {
         width: 7rem;
     }

     tbody td, thead th {
         font-size: 1rem;
         background-color: white;
         padding: 0.5rem 0.25rem;
         border-bottom: var(--thin-border);
         border-right: var(--thin-border);
     }

     thead th:last-child,
     thead tr:first-child th,
     thead tr:nth-child(2) th:nth-child(6),
     tbody td:nth-child(1),
     tbody td:nth-child(7),
     tbody td:last-child {
         border-right: var(--thick-border);
     }

     thead tr:first-child th:first-child,
     thead tr:nth-child(2) th {
         border-bottom: var(--thick-border);
     }

     thead tr:first-child th:first-child,
     tbody td:first-child {
         border-left: var(--thick-border);
     }

     thead tr:first-child th {
         border-top: var(--thick-border);
     }

     tfoot td {
         border-top: var(--thin-border);
         height: 0.1rem;
         padding: 0;
     }

     @media print {
         @page {
             size: A4 landscape;
             margin: 10mm 10mm 7.23mm 10mm;
         }
         :root {
             font-size: 2.77mm;
         }
         body {
             padding: 0;
         }
     }
    </style>
    <script>
     document.addEventListener("DOMContentLoaded", () => {
         for(let row of document.getElementsByTagName("tr")) {
             row.addEventListener("click", function () {
                 this.classList.toggle("highlight");
             });
         }
     });
    </script>

  </head>
  <body>
    <table class='j-ftl-table'>
      <colgroup>
        <col class="j-col-date">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
      </colgroup>
      <thead>
        <tr><th rowspan="2">Date</th><th colspan="6">Duty</th><th colspan="7">Block</th></tr>
        <tr><th>7 Days</th><th>14 Days</th><th>28 Days</th><th>12 Weeks</th><th>365 days</th><th>12 Calendar Months</th>
          <th>28 Days</th><th>12 Weeks</th><th>365 Days</th><th>6 Calendar Months</th><th>9 Calendar Months</th><th>12 Calendar Months</th><th>1 Calendar Year</th></tr>
      </thead>
      <tbody>
<tr><td>2026-10-19</td><td></td><td></td><td></td><td></td><td></td><td></td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td></tr>
<tr><td>2026-10-20</td><td></td><td></td><td></td><td></td><td></td><td></td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td><td>1:00</td></tr>
      </tbody>
      <tfoot><tr><td colspan="14"></td></tr></tfoot>
    </table>
  </body>
</html>
