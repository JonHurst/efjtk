<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
   <meta charset='UTF-8'>
    <title>Cumulative Totals</title>
    <meta name="viewport"
          content="width=device-width, minimum-scale=1.0, shrink-to-fit=no">
    <style>
     :root {
         --thin-border: 0.0625rem solid black;
         --thick-border: 0.125rem solid black;
         --stripe: #E0FFE0;
         background-color: white;
         color: black;
         font-family: helvetica, arial, sans-serif;
     }

     body {
         width: 82rem;
         margin: 0 auto;
         padding: 1rem 0 2rem;
     }

     table {
         margin: auto;
         border-collapse: separate;
         border-spacing: 0;
         text-align: center;
         table-layout: fixed;
         width: 80rem;
     }

     thead {
         font-weight: bold;
         position: sticky;
         top: 0;
         z-index: 2;
     }

     tbody {
         cursor: pointer;
     }

     tbody td:first-child,
     thead tr:first-child th:first-child {
         position: sticky;
         left: 0;
         z-index: 1;
     }

     tbody tr:nth-child(even) td {
         background-color: var(--stripe);
     }

     tbody tr.highlight td {
         background-color: yellow;
     }

     .j-col-datetime {
         width: 10rem;
     }
     .j-col-duration {
         width: 6rem;
     }

     thead tr, tbody tr {
         height: 2rem;
     }

     tfoot {
         height: 0;
     }

     thead th,
     tbody td {
         background-color: white;
         border-right: var(--thin-border);
     }
     tbody td {
         border-bottom: var(--thin-border);
     }
     tbody tr:last-child td {
         border-bottom: unset;
     }
     thead th {
         border-bottom: var(--thick-border);
     }

     tbody td:nth-child(1),
     tbody td:nth-child(4),
     tbody td:nth-child(5),
     tbody td:nth-child(7),
     tbody td:nth-child(9),
     tbody td:nth-child(13),
     thead th:nth-child(1),
     thead th:nth-child(4),
     thead th:nth-child(5),
     thead th:nth-child(7),
     thead th:nth-child(9),
     thead th:nth-child(13) {
         border-right: var(--thick-border);
     }

     tbody td:first-child,
     thead th:first-child {
         border-left: var(--thick-border);
     }

     thead th,
     tfoot td {
         border-top: var(--thick-border);
     }

     @media print {
         @page {
             size: A4 landscape;
             margin: 1cm;
         }
         :root {
             font-size: 2.763mm;
             --thick-border: 0.15rem solid black;
         }
         body {
             padding: 0;
         }
         thead,
         tbody td:first-child,
         thead tr:first-child th:first-child {
             position: relative;
         }
     }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
          for(let row of document.getElementsByTagName("tr")) {
              row.addEventListener("click", function () {
                  this.classList.toggle("highlight");
              });
          }
      });
    </script>
  </head>
  <body>
    <table>
      <colgroup>
        <col class="j-col-datetime">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-landings">
        <col class="j-col-landings">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
        <col class="j-col-duration">
      </colgroup>
      <thead>
        <tr><th>End of Sector</th><th>SPSE</th><th>SPME</th><th>MC</th>
          <th>Total</th><th>Day Ldg</th><th>Night Ldg</th>
          <th>Night</th><th>IFR</th>
          <th>PIC</th><th>Co-Pilot</th><th>Dual</th><th>Inst</th></tr>
      </thead>
      <tbody>
<tr><td>03/01/2024 02:00</td><td></td><td></td><td>5:00</td><td>5:00</td><td>2</td><td>0</td><td></td><td>5:00</td><td>5:00</td><td></td><td></td><td></td></tr>
<tr><td>03/01/2024 11:00</td><td>1:00</td><td></td><td>5:00</td><td>6:00</td><td>8</td><td>0</td><td></td><td>5:00</td><td>6:00</td><td></td><td></td><td>1:00</td></tr>
<tr><td>03/01/2024 12:30</td><td>1:30</td><td></td><td>5:00</td><td>6:30</td><td>9</td><td>0</td><td></td><td>5:00</td><td>6:00</td><td></td><td>0:30</td><td>1:00</td></tr>
<tr><td>03/01/2024 20:30</td><td>2:00</td><td></td><td>5:00</td><td>7:00</td><td>9</td><td>1</td><td>0:30</td><td>5:00</td><td>6:30</td><td></td><td>0:30</td><td>1:00</td></tr>
      </tbody>
      <tfoot>
        <tr><td colspan="13"></td></tr>
      </tfoot>
    </table>
  </body>
</html>
